name: Model and XML validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package and XML validation dependency
        run: python -m pip install -e '.[validation]'
      - name: Check CLI
        run: python -m rospacer --help
      - name: Run model and schema tests
        run: python -m unittest discover -s tests -v
