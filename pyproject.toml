[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rospacer"
version = "1.0.0"
description = "Research prototype for ROS 2 wireless DDS pacing"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
validation = ["lxml>=4.8"]

[project.urls]
Repository = "https://github.com/taehun25/ROSPacer"

[project.scripts]
rospacer = "rospacer.__main__:main"

[tool.setuptools.packages.find]
include = ["rospacer*"]
